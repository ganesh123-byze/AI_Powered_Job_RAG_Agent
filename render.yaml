services:
  - type: web
    name: job-rag-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 180
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # Add your secrets in the Render dashboard → Environment tab:
      # OPENROUTER_API_KEY
      # ADZUNA_APP_ID
      # ADZUNA_API_KEY
